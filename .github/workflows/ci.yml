name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint And Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace @smart-erp/api run prisma:generate

      - name: Lint workspaces
        run: npm run lint

      - name: Build workspaces
        run: npm run build
